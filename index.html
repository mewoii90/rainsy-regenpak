<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainsy — Premium Regenbescherming</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;

      /* ACHTERGRONDFOTO */
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)),
        url('RAIN.jpg');
      background-size: cover;
      background-position: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
    }

    .nav-logo svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }

    nav {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.8;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .hero-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .hero {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .logo-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: clamp(4.5rem, 11vw, 8.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff;
      user-select: none;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.35));
    }

    .rain-i {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: 0.55em;
      margin: 0 0.04em;
    }

    .rain-i svg {
      width: 1.55em;
      height: auto;
      margin-bottom: -0.05em;
      overflow: visible;
    }

    .subtitle {
      font-size: clamp(1.1rem, 2.2vw, 1.65rem);
      font-weight: 400;
      color: #f8fafc;
      margin-bottom: 36px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #0b2259;
      padding: 14px 36px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #f1f5f9;
      transform: translateY(-2px);
    }

    footer {
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      color: #ffffff;
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

    </div>
    <nav>

            <path d="M44 92C44 92 39 100 39 104C39 106.8 41.2 109 44 109C46.8 109 49 106.8 49 104C49 100 44 92 44 92Z" fill="white"/>

  <footer>

</body>
</html>
