<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collectie — Rainsy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b2259;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      background-color: #0b2259;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-logo svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }

    nav {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.8;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .page-content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 60px 24px;
      width: 100%;
      flex: 1;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .page-subtitle {
      text-align: center;
      color: #93c5fd;
      font-size: 1.1rem;
      margin-bottom: 48px;
    }

    /* Rooster met 4 vakken */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
    }

    .product-card {
      background: #112963;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    .product-image-container {
      width: 100%;
      height: 420px;
      background-color: #1e3a8a;
      overflow: hidden;
    }

    .product-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    .product-title {
      font-size: 1.35rem;
      font-weight: 600;
    }

    .product-desc {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    footer {
      background-color: #081a44;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 14px;
      }
      nav {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-logo">
      <svg viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg">
        <path d="M48 34H18C11.4 34 6 28.6 6 22C6 15.9 10.6 10.8 16.5 10.1C19.2 4.1 25.2 0 32 0C41.4 0 49 7.6 49 17C49 17.4 49 17.8 48.9 18.2C54.1 19.3 58 23.9 58 29.5C58 32 53.5 34 48 34Z" fill="#fff"/>
        <path d="M20 39L17 46C16.5 47.2 17.4 48.5 18.7 48.5C19.6 48.5 20.4 47.9 20.7 47L23 39H20Z" fill="#fff"/>
        <path d="M32 41L29 48C28.5 49.2 29.4 50.5 30.7 50.5C31.6 50.5 32.4 49.9 32.7 49L35 41H32Z" fill="#fff"/>
        <path d="M44 39L41 46C40.5 47.2 41.4 48.5 42.7 48.5C43.6 48.5 44.4 47.9 44.7 47L47 39H44Z" fill="#fff"/>
      </svg>
    </div>
    <nav>
      <a href="index.html">hoofdpagina</a>
      <a href="collectie.html">collectie</a>
      <a href="#technologie">technologie</a>
      <a href="#over-ons">over ons</a>
      <a href="#winkelwagen">winkelwagen (0)</a>
    </nav>
  </header>

  <div class="page-content">
    <h1>Onze Collectie</h1>
    <p class="page-subtitle"> Rainsy ontdek alle kleuren voor jongeren</p>

    <div class="products-grid">
      
      <!-- Vak 1 -->
      <div class="product-card">
        <div class="product-image-container">
          <img src="foto1.png" alt="Rain2Go Editie 1">
        </div>
        <div class="product-info">
          <h2 class="product-title">Rain2Go Edition 1</h2>
          
        </div>
      </div>

      <!-- Vak 2 -->
      <div class="product-card">
        <div class="product-image-container">
          <img src="foto2.png" alt="Rain2Go Editie 2">
        </div>
        <div class="product-info">
          <h2 class="product-title">Rain2Go Edition 2</h2>
          
        </div>
      </div>

      <!-- Vak 3 -->
      <div class="product-card">
        <div class="product-image-container">
          <img src="foto3.png" alt="Rain2Go Editie 3">
        </div>
        <div class="product-info">
          <h2 class="product-title">Rain2Go Edition 3</h2>
          
        </div>
      </div>

      <!-- Vak 4 -->
      <div class="product-card">
        <div class="product-image-container">
          <img src="foto4.png" alt="Rain2Go Editie 4">
        </div>
        <div class="product-info">
          <h2 class="product-title">Rain2Go Edition 4</h2>
         
        </div>
      </div>

    </div>
  </div>

  <footer>
    rainsy rainwear. waterproof & stylish.
  </footer>

</body>
</html>
