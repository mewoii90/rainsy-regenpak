<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winkelwagen — Rainsy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b2259;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-logo svg { width: 42px; height: 42px; fill: #ffffff; }
    nav { display: flex; gap: 32px; align-items: center; }
    nav a { color: #ffffff; text-decoration: none; font-size: 0.95rem; font-weight: 500; }
    nav a:hover { opacity: 0.8; text-decoration: underline; text-underline-offset: 6px; }
    .page-content { max-width: 800px; margin: 0 auto; padding: 60px 24px; width: 100%; flex: 1; }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 24px; }
    .cart-container {
      background: #112963;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 32px;
    }
    .empty-cart { text-align: center; color: #93c5fd; font-size: 1.1rem; padding: 40px 0; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      font-size: 1.2rem;
      font-weight: 700;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      padding-top: 20px;
    }
    .checkout-btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      text-align: center;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 32px;
      text-decoration: none;
    }
    .checkout-btn:hover { background-color: #1d4ed8; }
    footer { background-color: #081a44; text-align: center; padding: 20px; font-size: 0.85rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="nav-logo">
      <svg viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg">
        <path d="M48 34H18C11.4 34 6 28.6 6 22C6 15.9 10.6 10.8 16.5 10.1C19.2 4.1 25.2 0 32 0C41.4 0 49 7.6 49 17C49 17.4 49 17.8 48.9 18.2C54.1 19.3 58 23.9 58 29.5C58 32 53.5 34 48 34Z" fill="#fff"/>
      </svg>
    </div>
    <nav>
      <a href="index.html">hoofdpagina</a>
      <a href="collectie.html">collectie</a>
      <a href="over-ons.html">over ons</a>
      <a href="winkelwagen.html">winkelwagen (0)</a>
    </nav>
  </header>

  <div class="page-content">
    <h1>Jouw Winkelwagen</h1>
    <div class="cart-container">
      <p class="empty-cart">Je winkelwagen is momenteel nog leeg.</p>
    </div>
    <a href="#" class="checkout-btn">Afrekenen</a>
  </div>

  <footer>
    © 2026 rainsy rainwear. waterproof & stylish.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cartContainer = document.querySelector('.cart-container');
      let cart = JSON.parse(localStorage.getItem('rainsyCart')) || [];

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="empty-cart">Je winkelwagen is momenteel nog leeg.</p>';
      } else {
        let html = '';
        let total = 0;

        cart.forEach(item => {
          total += item.price;
          html += `
            <div class="cart-item">
              <span>${item.name}</span>
              <span>€${item.price.toFixed(2)}</span>
            </div>
          `;
        });

        html += `
          <div class="cart-total">
            <span>Totaal</span>
            <span>€${total.toFixed(2)}</span>
          </div>
        `;

        cartContainer.innerHTML = html;
      }
    });
  </script>

</body>
</html>
